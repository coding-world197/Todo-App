<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>

    <div class="app-card">
        <div class="header">
            <div>
                <h1>Task Master</h1>
            </div>
            <div class="date-badge" id="currentDate">Mon, Aug 4</div>
        </div>

        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="pendingTasks">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">Done</div>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task..." onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addTask()">
                <i class="fa-solid fa-plus"></i> Add
            </button>
        </div>

        <div class="filter-group">
            <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
            <button class="filter-btn" onclick="setFilter('active', this)">Pending</button>
            <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
        </div>

        <ul class="task-list" id="taskList">
        </ul>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>Edit Task</h3>
            <input type="text" id="editInput" placeholder="Update your task...">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn-save" onclick="saveEditedTask()">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
